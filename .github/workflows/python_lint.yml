name: Run Ruff Linting and Formatting

on:
  workflow_call:

jobs:
  python_lint:
    name: Python Linting and Formatting checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version-file: .python-version
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install linting requirements
      run: uv sync --locked --group linting
    - name: Run Python linting check
      run: uv run ruff check --no-fix --output-format github
    - name: Run Python formatting check
      run: uv run ruff format --diff
